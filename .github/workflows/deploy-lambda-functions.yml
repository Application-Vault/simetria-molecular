name: Deploy Lambda Functions

on:
  push:
    branches: [ "backend" ]
    paths:
      - "infra/lambda_src/**"
      - ".github/workflows/deploy-lambda-functions.yml"

env:
  AWS_REGION: us-east-2
  LAMBDA_NAME: simetria-molecular-prod

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      simetria: ${{ steps.filter.outputs.simetria }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            simetria:
              - 'infra/lambda_src/handler/**'

  deploy-simetria:
    needs: changes
    if: needs.changes.outputs.simetria == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_LAMBDA_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-lambda-deploy


      - name: Package lambda (handler root + deps)
        run: |
          set -e
          rm -rf dist .lambda_build
          mkdir -p dist .lambda_build

          # Copia SÓ handler/
          rsync -a infra/lambda_src/handler/ .lambda_build/

          # Mostra versão (debug útil)
          python --version

          # Instala deps dentro do build (Linux + CPython 3.11)
          if [ -f ".lambda_build/requirements.txt" ]; then
            python -m pip install --upgrade pip
            python -m pip install -r .lambda_build/requirements.txt -t .lambda_build/
          fi

          cd .lambda_build
          zip -r ../dist/simetria.zip .

      - name: Deploy lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_NAME }}" \
            --zip-file fileb://dist/simetria.zip
      